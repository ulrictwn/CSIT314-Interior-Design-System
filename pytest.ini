[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    story1: Create user profiles
    story2: View user profiles
    story3: Update user profiles
    story4: Suspend unassigned user profiles
    story5: Search user profiles
    story6: Create user accounts
    story7: View user accounts
    story8: Update user accounts
    story9: Suspend user accounts
    story10: Search user accounts
    story11: User Admin login
    story12: User Admin logout
    story13: Create company profile
    story14: View company profile
    story15: Delete company profile
    story16: Update company profile
    story17: Search company profile
    story18: Interior Designer login
    story19: Interior Designer logout
    story20: Create new project
    story21: Update new project
    story22: View new project
    story23: Search new projects
    story24: Delete new project
    story25: Create past project
    story26: View past project
    story27: Update past project
    story28: Search past projects
    story29: Delete past project
    database: Schema and persistence compatibility
filterwarnings =
    ignore:Skipped unsupported reflection of expression-based index:sqlalchemy.exc.SAWarning
