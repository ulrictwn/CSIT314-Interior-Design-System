[pytest]
testpaths = tests/profiles
pythonpath = .
addopts = -ra --strict-markers
markers =
    story1: Create user profiles
    story2: View user profiles
    story3: Update user profiles
    story4: Suspend unassigned user profiles
    story5: Search user profiles
    story6: Create user accounts
    story7: View user accounts
    story8: Update user accounts
    story9: Suspend user accounts
    story10: Search user accounts
    story11: User Admin login
    story12: User Admin logout
    security: Access control and CSRF
    database: Schema and persistence compatibility
filterwarnings =
    ignore:Skipped unsupported reflection of expression-based index:sqlalchemy.exc.SAWarning
