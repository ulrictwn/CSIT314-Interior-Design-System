name: User Admin Stories 1-12 CI and Delivery

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profiles-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile-tests:
    name: User Admin tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database: [SQLite, PostgreSQL]
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-disposable-password
          POSTGRES_DB: nestora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nestora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Deliberately unrelated to your Codespace database and secrets.
      TEST_DATABASE_URL: ${{ matrix.database == 'PostgreSQL' && 'postgresql+psycopg://postgres:ci-only-disposable-password@localhost:5432/nestora_test' || '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - name: Install application and testing dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run stories 1-12 tests
        id: tests
        run: python scripts/run_profile_tests.py
      - name: Show every test result in the run summary
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          DATABASE_LABEL: ${{ matrix.database }}
        run: python scripts/profile_test_report.py --label "$DATABASE_LABEL" --run-result "$TEST_OUTCOME" --github
      - name: Upload HTML, JUnit and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: profile-reports-${{ matrix.database }}
          path: reports/
          if-no-files-found: error
          retention-days: 14

  deliver-source:
    name: Deliver tested source package
    needs: profile-tests
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out tested source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build source ZIP
        run: python scripts/package_profiles.py
      - name: Deliver source ZIP as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: nestora-user-admin-tested-source
          path: dist/nestora-user-admin.zip
          if-no-files-found: error
          retention-days: 14
