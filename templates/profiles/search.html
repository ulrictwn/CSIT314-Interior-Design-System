{% extends 'base.html' %}{% from 'macros.html' import profile_table with context %}{% block content %}
<header class="page-heading"><div><h1>Search User Profiles</h1><p>Find profiles by name or description.</p></div></header><section class="form-card search-card"><form class="search-bar" method="get"><label class="sr-only" for="query">Search profiles</label><input class="form-control" id="query" name="q" value="{{ query }}" placeholder="Search" maxlength="200" required><button class="button button-primary">Search</button></form></section>{% if profiles is not none %}<div class="section-heading"><h2>User profiles</h2><span>{{ profiles|length }} result(s)</span></div>{{ profile_table(profiles) }}{% endif %}
{% endblock %}
